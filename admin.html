<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ページ - 古文単語マスター</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a227">
</head>
<body data-role-page="admin">
<div id="app">
  <div class="loading" id="loading-screen">読み込み中...</div>
  <div class="auth-fab" id="auth-fab"></div>
  <div class="sync-status" id="sync-status"></div>
  <main class="role-page-shell">
    <div class="header role-page-header">
      <button class="back-btn" onclick="location.href='./index.html'">← ホーム</button>
      <div>
        <div class="header-title">管理者ページ</div>
        <div class="header-sub">ユーザー管理・参加コード・通知・メンテナンス設定</div>
      </div>
    </div>
    <div class="content role-page-content" id="role-page-body"></div>
  </main>
  <div id="home-ranking-panel" style="display:none"></div>
  <div id="screen-ranking" class="screen" style="display:none"></div>
  <div id="screen-account" class="screen" style="display:none"></div>
  <div class="auth-choice-backdrop" id="auth-choice-modal" aria-hidden="true">
  <div class="auth-choice-modal" role="dialog" aria-modal="true" aria-labelledby="auth-choice-title">
    <button type="button" class="auth-choice-close" onclick="closeAuthModal()" aria-label="閉じる">×</button>
    <div class="welcome-badge">LOGIN</div>
    <h2 id="auth-choice-title">ログイン方法を選択</h2>
    <p class="auth-choice-lead">アクセス許可のあるアカウントでログインしてください。</p>
    <button type="button" class="auth-google-btn" onclick="loginGoogle()">Googleでログイン</button>
    <div class="auth-divider"><span>またはメールでログイン</span></div>
    <div class="email-auth-box">
      <input id="auth-email-input" type="email" inputmode="email" autocomplete="email" placeholder="メールアドレス">
      <input id="auth-password-input" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）">
      <div class="email-auth-actions">
        <button type="button" class="email-login-btn" onclick="loginEmail()">ログイン</button>
        <button type="button" class="email-signup-btn" onclick="signupEmail()">新規登録</button>
      </div>
      <button type="button" class="password-reset-btn" onclick="resetPassword()">パスワードを忘れた場合</button>
    </div>
  </div>
</div>
</div>
<script src="assets/js/app.js"></script>
</body>
</html>
