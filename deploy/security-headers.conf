# Include inside this site's Apache HTTPS VirtualHost. Requires mod_headers.
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
# Report-Only preserves existing inline scripts while showing migration violations.
Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudflareinsights.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
