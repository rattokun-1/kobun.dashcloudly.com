<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メンテナンス中</title>
  <link rel="stylesheet" href="assets/css/maintenance.css">
</head>
<body>
  <main class="card">
    <div class="icon">🛠️</div>
    <div class="label">MAINTENANCE</div>
    <h1>ただいまメンテナンス中です</h1>
    <p class="lead">
      ご利用いただきありがとうございます。<br>
      現在、サービス改善のため一時的にメンテナンスを実施しています。<br>
      復旧までしばらくお待ちください。
    </p>

    <section class="info">
      <div class="row">
        <div class="emoji">📌</div>
        <div>
          <div class="row-title">現在の状況</div>
          <div class="row-text">システムの調整・アップデート作業を行っています。</div>
        </div>
      </div>
      <div class="row">
        <div class="emoji">⏰</div>
        <div>
          <div class="row-title">復旧予定</div>
          <div class="row-text">作業完了後、順次サービスを再開します。</div>
        </div>
      </div>
      <div class="row">
        <div class="emoji">🙏</div>
        <div>
          <div class="row-title">お願い</div>
          <div class="row-text">ご不便をおかけしますが、再度時間をおいてアクセスしてください。</div>
        </div>
      </div>
    </section>

    <div class="footer">© <strong>Maintenance Page</strong></div>
  </main>
</body>
</html>
